# Controller SSSD/NSS sidecar overlay.
#
# Status: image built, pushed, deployed, and validated on the live cluster.
#
# This overlay is intended to be merged into the active OKE values after a
# controller image has been built with NSS/SSSD client support. The stock
# 25.11 ubuntu24.04 slurmctld image does not include libnss-sss or an
# nsswitch.conf configured for `sss`, so this sidecar alone is not sufficient.

controller:
  slurmctld:
    image:
      repository: iad.ocir.io/idxzjcdglx2s/slinky
      tag: slurmctld-pmix-sssd-nss-25.11-ubuntu24.04
    volumeMounts:
      # libnss-sss in the slurmctld container talks to the SSSD responder
      # socket created by the sidecar under /var/lib/sss/pipes.
      - name: sssd-state
        mountPath: /var/lib/sss
      # Included for completeness; SSSD implementations may place runtime
      # sockets or pid material under /run/sssd.
      - name: sssd-run
        mountPath: /run/sssd

  podSpec:
    # The operator defaults the controller pod to non-root. The slurmctld
    # container still has its own non-root container security context, but the
    # SSSD sidecar must be allowed to run as root.
    securityContext:
      runAsNonRoot: false
      fsGroup: 401
    volumes:
      - name: sssd-conf
        secret:
          secretName: site-sssd-ldap-test-conf
          defaultMode: 0600
          items:
            - key: sssd.conf
              path: sssd.conf
              mode: 0600
      - name: sssd-state
        emptyDir: {}
      - name: sssd-run
        emptyDir: {}
      - name: sssd-log
        emptyDir: {}
    containers:
      - name: sssd
        image: ghcr.io/slinkyproject/login:25.11-ubuntu24.04
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
          - -lc
        args:
          - |
            set -euo pipefail
            install -d -m 0700 /etc/sssd
            install -o root -g root -m 0600 /etc/sssd-secret/sssd.conf /etc/sssd/sssd.conf
            install -d -m 0755 /var/lib/sss
            install -d -m 0700 /var/lib/sss/db /var/lib/sss/keytabs /var/lib/sss/secrets
            install -d -m 0751 /var/lib/sss/deskprofile
            install -d -m 0755 /var/lib/sss/gpo_cache /var/lib/sss/pipes /var/lib/sss/pubconf /var/lib/sss/pubconf/krb5.include.d /run/sssd
            install -d -m 0750 /var/lib/sss/pipes/private /var/log/sssd
            install -d -m 0775 /var/lib/sss/mc
            chown -R root:root /var/lib/sss /run/sssd /var/log/sssd
            chmod 0755 /var/lib/sss /var/lib/sss/gpo_cache /var/lib/sss/pipes /var/lib/sss/pubconf /var/lib/sss/pubconf/krb5.include.d /run/sssd
            chmod 0700 /var/lib/sss/db /var/lib/sss/keytabs /var/lib/sss/secrets
            chmod 0751 /var/lib/sss/deskprofile
            chmod 0750 /var/lib/sss/pipes/private /var/log/sssd
            chmod 0775 /var/lib/sss/mc
            rm -f /var/lib/sss/pipes/nss /var/lib/sss/pipes/pam /var/lib/sss/pipes/ssh
            rm -f /var/lib/sss/pipes/private/* /run/sssd.pid /run/sssd/*.pid
            exec /usr/sbin/sssd -i
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: sssd-conf
            mountPath: /etc/sssd-secret
            readOnly: true
          - name: sssd-state
            mountPath: /var/lib/sss
          - name: sssd-run
            mountPath: /run/sssd
          - name: sssd-log
            mountPath: /var/log/sssd
