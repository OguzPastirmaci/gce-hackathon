# Experimental GB300 topology/block overlay.
#
# Apply this on top of the existing GB300 HA OpenLDAP/SSSD/FSS/IMEX values with
# `helm upgrade --reuse-values -f`.
#
# The four nodes below are the active Slinky GB300 worker nodes observed on
# 2026-05-06:
# - slurm-worker-gb300-0 -> 10.140.79.152
# - slurm-worker-gb300-1 -> 10.140.71.103
# - slurm-worker-gb300-2 -> 10.140.88.115
# - slurm-worker-gb300-3 -> 10.140.93.120
#
# The blocks are intentionally not the StatefulSet ordinal order. This makes it
# easier to see whether Slurm ranks allocations by block rather than by node
# name or pod ordinal.

controller:
  extraConfMap:
    TopologyParam: BlockAsNodeRank

configFiles:
  topology.yaml: |
    ---
    - topology: topo-gb300-block
      cluster_default: true
      block:
        block_sizes:
          - 2
          - 4
        blocks:
          - block: gb300_b0
            nodes: "10.140.71.103,10.140.88.115"
          - block: gb300_b1
            nodes: "10.140.79.152,10.140.93.120"
