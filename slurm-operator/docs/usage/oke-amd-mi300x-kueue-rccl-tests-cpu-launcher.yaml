# OCI RCCL MPIJob for BM.GPU.MI300X.8 with the launcher on a non-GPU node.
#
# This is based on the oracle-quickstart/oci-hpc-oke MI300X RCCL Kueue
# manifest. The upstream manifest has a single ResourceFlavor for CPU, memory,
# ephemeral-storage, and amd.com/gpu, which causes Kueue to inject the GPU node
# selector into the launcher pod too. This variant keeps workers on MI300X nodes
# but gives Kueue a separate CPU-node flavor for the launcher podset.
#
# The tested two-node cluster only had rdma4/mlx5_5 and rdma5/mlx5_7 reachable
# between MI300X nodes, so the MPI/RCCL command below restricts UCX and RCCL to
# those HCAs. Re-test the full OCI rail list before widening this on another
# cluster.
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: cpu-e5-flex
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: VM.Standard.E5.Flex
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: bm-gpu-mi300x-8
spec:
  nodeLabels:
    amd.com/gpu: "true"
    node.kubernetes.io/instance-type: BM.GPU.MI300X.8
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: bm-gpu-mi300x-8-rccl-tests-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - ephemeral-storage
        - amd.com/gpu
      flavors:
        - name: cpu-e5-flex
          resources:
            - name: cpu
              nominalQuota: 64
            - name: memory
              nominalQuota: 256Gi
            - name: ephemeral-storage
              nominalQuota: 512Gi
            - name: amd.com/gpu
              nominalQuota: 0
        - name: bm-gpu-mi300x-8
          resources:
            - name: cpu
              nominalQuota: 448
            - name: memory
              nominalQuota: 4Ti
            - name: ephemeral-storage
              nominalQuota: 128Gi
            - name: amd.com/gpu
              nominalQuota: 16
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  namespace: default
  name: bm-gpu-mi300x-8-rccl-tests
spec:
  clusterQueue: bm-gpu-mi300x-8-rccl-tests-queue
---
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: rccl-tests
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: bm-gpu-mi300x-8-rccl-tests
spec:
  slotsPerWorker: 8
  runLauncherAsWorker: false
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        metadata:
          labels:
            rccl-tests-replica: mpi-launcher
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node.kubernetes.io/instance-type: VM.Standard.E5.Flex
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 2
          containers:
            - name: mpi-launcher
              image: iad.ocir.io/idxzjcdglx2s/rccl-tests:rocm-7.1.1-ubuntu22.04-rccl-2.27.7-011826.1
              imagePullPolicy: Always
              workingDir: /workspace
              command:
                - bash
                - -c
              args:
                - |
                  set -e -o pipefail
                  trap 'exit 1' SIGINT
                  NUM_GPUS=8
                  NUM_HOSTS=$(sed -n '$=' /etc/mpi/hostfile)
                  NP=$(($NUM_HOSTS*$NUM_GPUS))

                  while ! (for host in $(awk '{print $1}' /etc/mpi/hostfile); do
                    ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no -p 2222 $host exit 2>/dev/null || exit 1
                  done); do
                    echo "Waiting for workers to be ready..."
                    sleep 5
                  done
                  echo "All workers are ready!"

                  mpirun \
                    -mca coll ^hcoll \
                    -mca pml ucx \
                    -mca btl ^openib \
                    -mca plm_rsh_args '-p 2222' \
                    --allow-run-as-root \
                    -np $NP \
                    -npernode $NUM_GPUS \
                    --bind-to numa \
                    -x RX_QUEUE_LEN=8192 \
                    -x IB_RX_QUEUE_LEN=8192 \
                    -x UCX_NET_DEVICES=mlx5_5:1,mlx5_7:1 \
                    -x HCOLL_ENABLE_MCAST_ALL=0 \
                    -x coll_hcoll_enable=0 \
                    -x NCCL_CUMEM_ENABLE=0 \
                    -x NCCL_IB_TIMEOUT=22 \
                    -x NCCL_IB_SL=0 \
                    -x NCCL_IB_TC=41 \
                    -x NCCL_IB_GID_INDEX=3 \
                    -x NCCL_DEBUG=WARN \
                    -x NCCL_IB_QPS_PER_CONNECTION=1 \
                    -x NCCL_IB_SPLIT_DATA_ON_QPS=0 \
                    -x NCCL_IB_HCA='=mlx5_5,mlx5_7' \
                    -x NCCL_PXN_DISABLE=0 \
                    -x NCCL_NET_PLUGIN=none \
                    -x LD_LIBRARY_PATH \
                    /workspace/rccl-tests/build/all_reduce_perf -b 1G -e 16G -f 2 -g 1 -n 50
              ports:
                - containerPort: 2222
                  name: mpijob-port
              resources:
                limits:
                  ephemeral-storage: 32Gi
                requests:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 32Gi
              securityContext:
                privileged: true
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
              volumeMounts:
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
    Worker:
      replicas: 2
      template:
        metadata:
          labels:
            rccl-tests-replica: mpi-worker
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            amd.com/gpu: "true"
            node.kubernetes.io/instance-type: BM.GPU.MI300X.8
          tolerations:
            - key: amd.com/gpu
              operator: Exists
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 2
          containers:
            - name: mpi-worker
              image: iad.ocir.io/idxzjcdglx2s/rccl-tests:rocm-7.1.1-ubuntu22.04-rccl-2.27.7-011826.1
              imagePullPolicy: Always
              workingDir: /workspace
              command:
                - /bin/bash
                - -c
                - mkdir -p /var/run/sshd; /usr/sbin/sshd -D -p 2222
              ports:
                - containerPort: 2222
                  name: mpijob-port
              resources:
                limits:
                  amd.com/gpu: "8"
                  ephemeral-storage: 32Gi
                requests:
                  amd.com/gpu: "8"
                  cpu: "200"
                  memory: 1Ti
                  ephemeral-storage: 32Gi
              securityContext:
                privileged: true
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_PTRACE
              volumeMounts:
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
